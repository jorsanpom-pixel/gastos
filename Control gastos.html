<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1EC">
<title>Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --fondo: #EEF1EC;
    --papel: #FBFCFA;
    --tinta: #1D2B2A;
    --tenue: #5E6E6B;
    --linea: #D5DCD6;
    --aviso: #B4461F;
    --ok: #2F6B4F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #141A19;
      --papel: #1C2423;
      --tinta: #E6ECE8;
      --tenue: #93A39F;
      --linea: #2E3937;
      --aviso: #E07A52;
      --ok: #6FBF96;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

  /* Login */
  .login { max-width: 360px; margin: 18vh auto 0; display: grid; gap: 12px; }
  .login h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .campo { display: grid; gap: 4px; font-size: 14px; color: var(--tenue); }
  .campo input {
    padding: 12px; border: 1px solid var(--linea); border-radius: 10px;
    background: var(--papel); color: var(--tinta); font-size: 16px;
  }
  .btn {
    padding: 12px 16px; border-radius: 10px; border: 0;
    background: var(--tinta); color: var(--fondo); font-weight: 600;
  }
  .btn-sec {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--linea);
    background: transparent; font-size: 14px;
  }
  .error { color: var(--aviso); font-size: 14px; min-height: 20px; }

  /* Cabecera */
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mes { display: flex; align-items: center; gap: 4px; }
  .mes h2 { font-size: 18px; font-weight: 600; margin: 0; min-width: 150px; text-align: center; text-transform: capitalize; }
  .flecha {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linea);
    background: var(--papel); font-size: 18px; line-height: 1;
  }

  /* Total y tira */
  .total { margin: 28px 0 12px; }
  .total .cifra { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .total .cifra small { font-size: 26px; font-weight: 600; margin-left: 4px; }
  .total .nota { color: var(--tenue); font-size: 14px; margin-top: 6px; }
  .tira {
    display: flex; height: 40px; border-radius: 6px; overflow: hidden;
    background: var(--linea); margin-bottom: 14px;
  }
  .tira span { display: block; height: 100%; min-width: 3px; transition: flex-basis .3s ease; }
  .reparto { list-style: none; margin: 0 0 32px; padding: 0; display: grid; gap: 2px; }
  .reparto li {
    display: grid; grid-template-columns: 12px 1fr auto 48px; gap: 10px; align-items: center;
    padding: 6px 0; font-size: 15px;
  }
  .reparto .punto { width: 12px; height: 12px; border-radius: 3px; }
  .reparto .pct { color: var(--tenue); text-align: right; font-size: 13px; }

  /* Secciones */
  h3 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .bloque { margin-bottom: 32px; }
  .revisar {
    background: var(--papel); border: 1px solid var(--aviso); border-radius: 12px; padding: 14px;
  }
  .revisar h3 { color: var(--aviso); }
  .revisar p { margin: 0 0 12px; font-size: 14px; color: var(--tenue); }
  .pendiente { border-top: 1px solid var(--linea); padding: 12px 0 4px; display: grid; gap: 8px; }
  .pendiente:first-of-type { border-top: 0; padding-top: 0; }
  .pendiente .fila { display: flex; justify-content: space-between; gap: 8px; }
  .pendiente .controles { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .pendiente input, .pendiente select, .mov select {
    min-width: 0; padding: 8px; border: 1px solid var(--linea); border-radius: 8px;
    background: var(--fondo); font-size: 14px;
  }
  .pendiente label { font-size: 12px; color: var(--tenue); }

  /* Lista de movimientos */
  .lista { background: var(--papel); border-radius: 12px; border: 1px solid var(--linea); }
  .mov {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    padding: 12px 14px; border-top: 1px solid var(--linea);
  }
  .mov:first-child { border-top: 0; }
  .mov .nombre { font-weight: 500; overflow-wrap: anywhere; }
  .mov .importe { font-weight: 600; text-align: right; }
  .mov .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--tenue); }
  .mov .meta select { padding: 4px 6px; font-size: 13px; }
  .chip {
    border: 1px solid var(--linea); border-radius: 999px; padding: 3px 10px;
    background: transparent; font-size: 12px; color: var(--tenue);
  }
  .chip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--papel); }
  .borrar { margin-left: auto; border: 0; background: none; color: var(--tenue); font-size: 13px; text-decoration: underline; }
  .vacio { padding: 24px 14px; color: var(--tenue); text-align: center; }
  .pie { display: flex; justify-content: space-between; align-items: center; color: var(--tenue); font-size: 13px; }
  .aviso-flotante {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--tinta); color: var(--fondo); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .aviso-flotante.visible { opacity: 1; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <!-- Pantalla de acceso -->
  <form id="vista-login" class="login" hidden>
    <h1>Tus gastos</h1>
    <label class="campo">Email
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label class="campo">Contraseña
      <input id="pass" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Entrar</button>
    <div id="login-error" class="error" role="alert"></div>
  </form>

  <!-- Panel principal -->
  <div id="vista-app" hidden>
    <div class="cabecera">
      <div class="mes">
        <button class="flecha" id="mes-ant" aria-label="Mes anterior">‹</button>
        <h2 id="mes-nombre"></h2>
        <button class="flecha" id="mes-sig" aria-label="Mes siguiente">›</button>
      </div>
      <button class="btn-sec" id="recargar">Actualizar</button>
    </div>

    <section class="total">
      <div class="cifra" id="total"></div>
      <div class="nota" id="total-nota"></div>
    </section>
    <div class="tira" id="tira" aria-hidden="true"></div>
    <ul class="reparto" id="reparto"></ul>

    <section class="bloque revisar" id="bloque-revisar" hidden>
      <h3 id="revisar-titulo"></h3>
      <p>Elige la categoría y la palabra que identifica al comercio. Se guardará una regla y la próxima vez se clasificará solo.</p>
      <div id="pendientes"></div>
    </section>

    <section class="bloque">
      <h3>Movimientos</h3>
      <div class="lista" id="lista"></div>
    </section>

    <div class="pie">
      <span id="usuario"></span>
      <button class="btn-sec" id="salir">Cerrar sesión</button>
    </div>
  </div>
</main>
<div class="aviso-flotante" id="aviso" role="status"></div>

<script>
const SUPABASE_URL = "https://hloguitnfhiatvwnsbos.supabase.co";
const SUPABASE_KEY = "sb_publishable_mtFZV-I9R0h6La04pWZJ_g_nnm1sKBG";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIAS = {
  "Alimentación":   "#4E8A5B",
  "Transporte":     "#3A6EA5",
  "Ocio":           "#C9803A",
  "Ropa":           "#9A5C9E",
  "Vivienda":       "#7A5238",
  "Suministros":    "#3E9B9B",
  "Telefonía":      "#6C7FB8",
  "Cuota autónomo": "#A3474B",
  "Ahorro":         "#8FA33B",
  "Otros":          "#8C8C84",
  "Sin clasificar": "#B4461F"
};
const ELEGIBLES = Object.keys(CATEGORIAS).filter(c => c !== "Sin clasificar");

const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const fechaCorta = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" });
const nombreMes = new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" });

let mesActual = new Date(); mesActual.setDate(1); mesActual.setHours(0, 0, 0, 0);
let gastos = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = c => CATEGORIAS[c] || CATEGORIAS["Otros"];

function avisar(texto) {
  const a = $("aviso");
  a.textContent = texto;
  a.classList.add("visible");
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => a.classList.remove("visible"), 2200);
}

function opciones(sel, incluirSin) {
  const lista = incluirSin ? Object.keys(CATEGORIAS) : ELEGIBLES;
  return lista.map(c => `<option ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
}

// Palabra clave sugerida: el comercio en mayúsculas, sin números ni espacios de sobra
function palabraSugerida(comercio) {
  return String(comercio || "").toUpperCase().replace(/[0-9*#]+/g, " ").replace(/\s+/g, " ").trim();
}

/* ---------- Sesión ---------- */
async function iniciar() {
  const { data } = await db.auth.getSession();
  if (data.session) mostrarApp(data.session); else mostrarLogin();
}

function mostrarLogin() {
  $("vista-app").hidden = true;
  $("vista-login").hidden = false;
}

function mostrarApp(session) {
  $("vista-login").hidden = true;
  $("vista-app").hidden = false;
  $("usuario").textContent = session.user.email;
  cargar();
}

$("vista-login").addEventListener("submit", async e => {
  e.preventDefault();
  $("login-error").textContent = "";
  const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) { $("login-error").textContent = "Email o contraseña incorrectos."; return; }
  mostrarApp(data.session);
});

$("salir").addEventListener("click", async () => { await db.auth.signOut(); mostrarLogin(); });

/* ---------- Datos ---------- */
async function cargar() {
  $("mes-nombre").textContent = nombreMes.format(mesActual);
  const desde = new Date(mesActual);
  const hasta = new Date(mesActual); hasta.setMonth(hasta.getMonth() + 1);
  const { data, error } = await db.from("gastos")
    .select("*")
    .gte("fecha", desde.toISOString())
    .lt("fecha", hasta.toISOString())
    .order("fecha", { ascending: false });
  if (error) { avisar("No se pudieron cargar los gastos: " + error.message); return; }
  gastos = data;
  pintar();
}

function pintar() {
  const total = gastos.reduce((s, g) => s + Number(g.importe), 0);
  const [entero, dec] = eur.format(total).replace(/\s?€/, "").split(",");
  $("total").innerHTML = `${esc(entero)}<small>,${esc(dec || "00")} €</small>`;
  const deducible = gastos.filter(g => g.deducible).reduce((s, g) => s + Number(g.importe), 0);
  $("total-nota").textContent = `${gastos.length} ${gastos.length === 1 ? "gasto" : "gastos"}` +
    (deducible ? ` · ${eur.format(deducible)} deducibles` : "");

  // Reparto por categoría
  const porCat = {};
  gastos.forEach(g => { const c = g.categoria || "Sin clasificar"; porCat[c] = (porCat[c] || 0) + Number(g.importe); });
  const orden = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  $("tira").innerHTML = orden.map(([c, v]) => `<span style="flex-basis:${(v / total) * 100}%;background:${color(c)}"></span>`).join("");
  $("reparto").innerHTML = orden.map(([c, v]) => `
    <li><span class="punto" style="background:${color(c)}"></span>
      <span>${esc(c)}</span><span>${eur.format(v)}</span>
      <span class="pct">${Math.round((v / total) * 100)} %</span></li>`).join("");

  // Pendientes de revisar
  const pend = gastos.filter(g => !g.categoria || g.categoria === "Sin clasificar");
  $("bloque-revisar").hidden = pend.length === 0;
  $("revisar-titulo").textContent = `${pend.length} ${pend.length === 1 ? "gasto" : "gastos"} por revisar`;
  $("pendientes").innerHTML = pend.map(g => `
    <div class="pendiente" data-id="${g.id}">
      <div class="fila"><span>${esc(g.comercio || "Sin nombre")}</span><strong>${eur.format(g.importe)}</strong></div>
      <div class="controles">
        <select aria-label="Categoría">${opciones("Otros", false)}</select>
        <input aria-label="Palabra clave para la regla" value="${esc(palabraSugerida(g.comercio))}">
        <button class="btn-sec" data-accion="clasificar">Guardar</button>
      </div>
      <label>Categoría · palabra que identifica al comercio</label>
    </div>`).join("");

  // Movimientos
  $("lista").innerHTML = gastos.length ? gastos.map(g => `
    <div class="mov" data-id="${g.id}">
      <span class="nombre">${esc(g.comercio || "Sin nombre")}</span>
      <span class="importe">${eur.format(g.importe)}</span>
      <div class="meta">
        <span>${fechaCorta.format(new Date(g.fecha))}</span>
        <select aria-label="Cambiar categoría" data-accion="categoria">${opciones(g.categoria || "Sin clasificar", true)}</select>
        <button class="chip" data-accion="deducible" aria-pressed="${g.deducible}">Deducible</button>
        <button class="borrar" data-accion="borrar">Borrar</button>
      </div>
    </div>`).join("")
    : `<div class="vacio">No hay gastos en este mes. Paga con Apple Pay o usa el atajo "Gasto" y aparecerán aquí.</div>`;
}

/* ---------- Acciones ---------- */
async function clasificar(id, categoria, palabra) {
  palabra = palabra.toUpperCase().replace(/\s+/g, " ").trim();
  if (palabra.length < 3) { avisar("La palabra clave necesita al menos 3 letras."); return; }
  const { error: e1 } = await db.from("reglas").upsert({ palabra, categoria }, { onConflict: "palabra" });
  if (e1) { avisar("No se pudo guardar la regla: " + e1.message); return; }
  // Aplica la regla a este gasto y a cualquier otro sin clasificar del mismo comercio
  const ids = gastos
    .filter(g => g.id === id || ((!g.categoria || g.categoria === "Sin clasificar") && String(g.comercio || "").toUpperCase().includes(palabra)))
    .map(g => g.id);
  const { error: e2 } = await db.from("gastos").update({ categoria }).in("id", ids);
  if (e2) { avisar("No se pudo actualizar: " + e2.message); return; }
  avisar(ids.length > 1 ? `Regla guardada. ${ids.length} gastos clasificados.` : "Regla guardada.");
  cargar();
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-accion]");
  if (!btn || btn.tagName === "SELECT") return;
  const cont = btn.closest("[data-id]");
  const id = cont?.dataset.id;
  const accion = btn.dataset.accion;

  if (accion === "clasificar") {
    clasificar(id, cont.querySelector("select").value, cont.querySelector("input").value);
  }
  if (accion === "deducible") {
    const nuevo = btn.getAttribute("aria-pressed") !== "true";
    const { error } = await db.from("gastos").update({ deducible: nuevo }).eq("id", id);
    if (error) { avisar("No se pudo guardar."); return; }
    gastos.find(g => g.id === id).deducible = nuevo;
    pintar();
  }
  if (accion === "borrar") {
    const g = gastos.find(x => x.id === id);
    if (!confirm(`¿Borrar "${g.comercio || "Sin nombre"}" de ${eur.format(g.importe)}? No se puede deshacer.`)) return;
    const { error } = await db.from("gastos").delete().eq("id", id);
    if (error) { avisar("No se pudo borrar."); return; }
    avisar("Gasto borrado.");
    cargar();
  }
});

document.addEventListener("change", async e => {
  const sel = e.target.closest('select[data-accion="categoria"]');
  if (!sel) return;
  const id = sel.closest("[data-id]").dataset.id;
  const { error } = await db.from("gastos").update({ categoria: sel.value }).eq("id", id);
  if (error) { avisar("No se pudo cambiar la categoría."); return; }
  avisar("Categoría cambiada.");
  cargar();
});

$("mes-ant").addEventListener("click", () => { mesActual.setMonth(mesActual.getMonth() - 1); cargar(); });
$("mes-sig").addEventListener("click", () => { mesActual.setMonth(mesActual.getMonth() + 1); cargar(); });
$("recargar").addEventListener("click", cargar);

iniciar();
</script>
</body>
</html>
