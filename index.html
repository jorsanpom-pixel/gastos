<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F14" media="(prefers-color-scheme: dark)">
<title>Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --fondo: #F2F3F7;
    --tarjeta: #FFFFFF;
    --tinta: #15161C;
    --tenue: #6B6F7E;
    --linea: #E4E6EE;
    --heroe: #23245A;
    --heroe-2: #33358A;
    --heroe-tinta: #F4F4FF;
    --heroe-tenue: #B9BAE8;
    --acento: #5B5CF0;
    --aviso: #E8590C;
    --sube: #FFB4A2;
    --baja: #9EE6B8;
    --ok: #16A34A;
    --radio: 20px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0E0F14;
      --tarjeta: #181A22;
      --tinta: #EDEEF4;
      --tenue: #9296A8;
      --linea: #262936;
      --heroe: #26286A;
      --heroe-2: #3A3CA0;
      --acento: #8183FF;
      --aviso: #FF8A4C;
      --ok: #4ADE80;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 56px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  /* ---------- Acceso ---------- */
  .login { min-height: 80vh; display: grid; align-content: center; gap: 14px; max-width: 380px; margin: 0 auto; }
  .login h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 44px; line-height: 1; letter-spacing: -0.03em; margin: 0; }
  .login p { margin: 0 0 10px; color: var(--tenue); }
  .campo { display: grid; gap: 6px; font-size: 14px; color: var(--tenue); }
  .campo input {
    padding: 14px; border: 1px solid var(--linea); border-radius: 14px;
    background: var(--tarjeta); color: var(--tinta); font-size: 16px;
  }
  .btn {
    padding: 14px 16px; border-radius: 14px; border: 0;
    background: var(--acento); color: #fff; font-weight: 600; font-size: 16px;
  }
  .error { color: var(--aviso); font-size: 14px; min-height: 20px; }

  /* ---------- Héroe: mes, anillo y total ---------- */
  .heroe {
    position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, var(--heroe-2) 0%, var(--heroe) 60%);
    color: var(--heroe-tinta);
    border-radius: 28px; padding: 16px 16px 20px;
  }
  .heroe-cab { display: flex; align-items: center; justify-content: space-between; }
  .heroe-cab h2 { margin: 0; font-size: 18px; font-weight: 600; text-transform: capitalize; }
  .flecha {
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.12); color: var(--heroe-tinta); font-size: 22px; line-height: 1;
  }
  .flecha:active { background: rgba(255,255,255,.22); }
  .anillo-caja { position: relative; width: min(270px, 74vw); aspect-ratio: 1; margin: 10px auto 6px; }
  .anillo-caja svg { width: 100%; height: 100%; display: block; }
  .anillo-caja circle.seg { transition: stroke-dasharray .6s ease, stroke-dashoffset .6s ease; }
  .centro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; }
  .centro .etq { font-size: 13px; color: var(--heroe-tenue); }
  .cifra { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.035em; }
  .cifra small { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .comp { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; justify-self: center; background: rgba(255,255,255,.1); }
  .comp.sube { color: var(--sube); }
  .comp.baja { color: var(--baja); }
  .datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .dato { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px; text-align: center; }
  .dato b { display: block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .dato span { font-size: 12px; color: var(--heroe-tenue); }

  /* ---------- Tarjetas ---------- */
  .tarjeta { background: var(--tarjeta); border-radius: var(--radio); padding: 16px; margin-top: 14px; }
  .tarjeta h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .tarjeta-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .tarjeta-cab .nota { font-size: 13px; color: var(--tenue); }

  /* Día a día */
  .barras { display: flex; align-items: flex-end; gap: 3px; height: 110px; }
  .barra { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--acento); min-height: 3px; transition: height .5s ease; }
  .barra.cero { background: var(--linea); }
  .barra.hoy { background: var(--aviso); }
  .eje { display: flex; justify-content: space-between; font-size: 11px; color: var(--tenue); margin-top: 6px; }

  /* Categorías */
  .cats { display: grid; gap: 14px; }
  .cat { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; }
  .ico {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    font-size: 21px; line-height: 1; grid-row: span 2;
  }
  .cat .nombre { font-weight: 600; }
  .cat .cuanto { text-align: right; font-weight: 600; }
  .cat .pista { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; }
  .pista .riel { flex: 1; height: 8px; border-radius: 999px; background: var(--linea); overflow: hidden; }
  .pista .relleno { display: block; height: 100%; border-radius: 999px; transition: width .6s ease; }
  .pista .pct { font-size: 12px; color: var(--tenue); width: 38px; text-align: right; }

  /* Por revisar */
  .revisar { border: 2px solid var(--aviso); }
  .revisar h3 { color: var(--aviso); }
  .revisar p { margin: 0 0 14px; font-size: 14px; color: var(--tenue); }
  .pendiente { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--linea); }
  .pendiente:first-child { border-top: 0; padding-top: 0; }
  .pendiente .fila { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
  .pendiente .fila .ico { grid-row: auto; }
  .pendiente .controles { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .pendiente input, .pendiente select, .acc select {
    min-width: 0; padding: 10px; border: 1px solid var(--linea); border-radius: 12px;
    background: var(--fondo); font-size: 14px;
  }
  .btn-peq { padding: 10px 14px; border-radius: 12px; border: 0; background: var(--aviso); color: #fff; font-weight: 600; font-size: 14px; }

  /* Movimientos */
  .dia + .dia { margin-top: 18px; }
  .dia-cab { display: flex; justify-content: space-between; font-size: 13px; color: var(--tenue); padding: 0 2px 8px; }
  .dia-cab span:first-child::first-letter { text-transform: uppercase; }
  .mov { border-radius: 16px; }
  .mov + .mov { margin-top: 4px; }
  .mov summary {
    list-style: none; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
    padding: 8px; border-radius: 16px; cursor: pointer;
  }
  .mov summary::-webkit-details-marker { display: none; }
  .mov summary .ico { grid-row: auto; }
  .mov[open] { background: var(--fondo); }
  .mov .txt { min-width: 0; display: grid; }
  .mov .nombre { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .sub { font-size: 13px; color: var(--tenue); }
  .mov .imp { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 17px; }
  .acc { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 8px 12px 64px; }
  .chip {
    border: 1px solid var(--linea); border-radius: 999px; padding: 8px 14px;
    background: var(--tarjeta); font-size: 13px; color: var(--tenue);
  }
  .chip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .borrar { margin-left: auto; border: 0; background: none; color: var(--aviso); font-size: 13px; font-weight: 600; padding: 8px; }
  .vacio { text-align: center; padding: 24px 8px 12px; color: var(--tenue); }
  .vacio .grande { font-size: 40px; display: block; margin-bottom: 8px; }

  .pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--tenue); font-size: 13px; margin-top: 22px; padding: 0 4px; }
  .enlace { border: 0; background: none; color: var(--tenue); text-decoration: underline; font-size: 13px; padding: 6px 0; }
  .aviso-flotante {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px);
    background: var(--tinta); color: var(--fondo); padding: 12px 18px; border-radius: 14px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center;
  }
  .aviso-flotante.visible { opacity: 1; transform: translate(-50%, 0); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <!-- Acceso -->
  <form id="vista-login" class="login" hidden>
    <h1>Tus gastos</h1>
    <p>Entra con el email y la contraseña de tu usuario de Supabase.</p>
    <label class="campo">Email
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label class="campo">Contraseña
      <input id="pass" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Entrar</button>
    <div id="login-error" class="error" role="alert"></div>
  </form>

  <!-- Panel -->
  <div id="vista-app" hidden>
    <section class="heroe">
      <div class="heroe-cab">
        <button class="flecha" id="mes-ant" aria-label="Mes anterior">‹</button>
        <h2 id="mes-nombre"></h2>
        <button class="flecha" id="mes-sig" aria-label="Mes siguiente">›</button>
      </div>
      <div class="anillo-caja">
        <div id="anillo"></div>
        <div class="centro">
          <span class="etq">Gastado este mes</span>
          <span class="cifra" id="total"></span>
          <span class="comp" id="comp" hidden></span>
        </div>
      </div>
      <div class="datos">
        <div class="dato"><b id="d-num"></b><span>gastos</span></div>
        <div class="dato"><b id="d-media"></b><span>media al día</span></div>
        <div class="dato"><b id="d-deduc"></b><span>deducible</span></div>
      </div>
    </section>

    <section class="tarjeta revisar" id="bloque-revisar" hidden>
      <div class="tarjeta-cab"><h3 id="revisar-titulo"></h3></div>
      <p>Elige la categoría y la palabra que identifica al comercio. Se guarda como regla y la próxima vez se clasifica solo.</p>
      <div id="pendientes"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Día a día</h3><span class="nota" id="dia-max"></span></div>
      <div class="barras" id="barras"></div>
      <div class="eje" id="eje"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Categorías</h3></div>
      <div class="cats" id="cats"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Movimientos</h3><button class="enlace" id="recargar">Actualizar</button></div>
      <div id="lista"></div>
    </section>

    <div class="pie">
      <span id="usuario"></span>
      <button class="enlace" id="salir">Cerrar sesión</button>
    </div>
  </div>
</main>
<div class="aviso-flotante" id="aviso" role="status"></div>

<script>
var SUPABASE_URL = 'https://hloguitnfhiatvwnsbos.supabase.co';
var SUPABASE_KEY = 'sb_publishable_mtFZV-I9R0h6La04pWZJ_g_nnm1sKBG';
var DEMO = new URLSearchParams(location.search).has('demo');
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var CATS = {
  'Alimentación':   { c: '#22A45D', i: '🛒' },
  'Transporte':     { c: '#3B82F6', i: '🚗' },
  'Ocio':           { c: '#F59E0B', i: '🎉' },
  'Ropa':           { c: '#D946EF', i: '👕' },
  'Vivienda':       { c: '#8B5CF6', i: '🏠' },
  'Suministros':    { c: '#06B6D4', i: '💡' },
  'Telefonía':      { c: '#6366F1', i: '📱' },
  'Cuota autónomo': { c: '#EF4444', i: '💼' },
  'Ahorro':         { c: '#84CC16', i: '🐷' },
  'Otros':          { c: '#94A3B8', i: '📦' },
  'Sin clasificar': { c: '#F97316', i: '❓' }
};
var ELEGIBLES = Object.keys(CATS).filter(function (c) { return c !== 'Sin clasificar'; });

var TZ = 'Europe/Madrid';
var eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
var eurCorto = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
var horaFmt = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
var diaFmt = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long', timeZone: TZ });
var nombreMes = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' });
var soloMes = new Intl.DateTimeFormat('es-ES', { month: 'long' });

var mesActual = new Date(); mesActual.setDate(1); mesActual.setHours(0, 0, 0, 0);
var gastos = [];
var totalAnterior = 0;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function info(c) { return CATS[c] || CATS['Otros']; }
function catDe(g) { return g.categoria || 'Sin clasificar'; }
function icono(c) { var x = info(c); return '<span class="ico" style="background:' + x.c + '26">' + x.i + '</span>'; }

function avisar(texto) {
  var a = $('aviso');
  a.textContent = texto;
  a.classList.add('visible');
  clearTimeout(avisar.t);
  avisar.t = setTimeout(function () { a.classList.remove('visible'); }, 2400);
}

function opciones(sel, incluirSin) {
  var lista = incluirSin ? Object.keys(CATS) : ELEGIBLES;
  return lista.map(function (c) {
    return '<option ' + (c === sel ? 'selected' : '') + ' value="' + esc(c) + '">' + info(c).i + ' ' + esc(c) + '</option>';
  }).join('');
}

// Palabra clave sugerida: el comercio en mayúsculas, sin números ni espacios de sobra
function palabraSugerida(comercio) {
  return String(comercio || '').toUpperCase().replace(/[0-9*#]+/g, ' ').replace(/\s+/g, ' ').trim();
}

function mismoDia(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

/* ---------- Sesión ---------- */
async function iniciar() {
  if (DEMO) { mostrarApp({ user: { email: 'Modo demostración' } }); return; }
  var r = await db.auth.getSession();
  if (r.data.session) mostrarApp(r.data.session); else mostrarLogin();
}
function mostrarLogin() { $('vista-app').hidden = true; $('vista-login').hidden = false; }
function mostrarApp(session) {
  $('vista-login').hidden = true;
  $('vista-app').hidden = false;
  $('usuario').textContent = session.user.email;
  cargar();
}

$('vista-login').addEventListener('submit', async function (e) {
  e.preventDefault();
  $('login-error').textContent = '';
  var r = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (r.error) { $('login-error').textContent = 'Email o contraseña incorrectos.'; return; }
  mostrarApp(r.data.session);
});
$('salir').addEventListener('click', async function () {
  if (DEMO) { location.href = location.pathname; return; }
  await db.auth.signOut(); mostrarLogin();
});

/* ---------- Datos ---------- */
function demoDatos() {
  var hoy = new Date();
  var esMesActual = mesActual.getFullYear() === hoy.getFullYear() && mesActual.getMonth() === hoy.getMonth();
  var tope = esMesActual ? hoy.getDate() : new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0).getDate();
  var base = [
    ['MERCADONA 2341 BENIDORM', 42.35, 'Alimentación', 1], ['REPSOL BENIDORM', 55.00, 'Transporte', 2],
    ['Alquiler piso', 700.00, 'Vivienda', 1], ['NETFLIX.COM', 12.99, 'Ocio', 3], ['Cuota autónomo', 88.56, 'Cuota autónomo', 1],
    ['LIDL ALFAZ', 18.20, 'Alimentación', 5], ['INVERSIONES LEVANTE SL', 9.40, 'Sin clasificar', 6],
    ['ZARA BENIDORM', 39.95, 'Ropa', 8], ['Luz y agua', 62.10, 'Suministros', 10], ['GLOVO', 21.30, 'Ocio', 12],
    ['Movil', 10.45, 'Telefonía', 12], ['CONSUM', 33.80, 'Alimentación', 15], ['CABIFY', 14.60, 'Transporte', 18],
    ['Café con amigos', 4.50, 'Ocio', 20], ['MERCADONA 2341 BENIDORM', 27.15, 'Alimentación', 22]
  ];
  return base.filter(function (b) { return b[3] <= tope; }).map(function (b, n) {
    var f = new Date(mesActual.getFullYear(), mesActual.getMonth(), b[3], 10 + (n % 9), (n * 7) % 60);
    return { id: 'demo' + n, fecha: f.toISOString(), importe: b[1], comercio: b[0], categoria: b[2], deducible: b[2] === 'Cuota autónomo', origen: 'demo' };
  }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
}

async function cargar() {
  $('mes-nombre').textContent = nombreMes.format(mesActual);
  if (DEMO) { gastos = demoDatos(); totalAnterior = 1090; pintar(); return; }
  var desde = new Date(mesActual);
  var hasta = new Date(mesActual); hasta.setMonth(hasta.getMonth() + 1);
  var antes = new Date(mesActual); antes.setMonth(antes.getMonth() - 1);
  var res = await Promise.all([
    db.from('gastos').select('*').gte('fecha', desde.toISOString()).lt('fecha', hasta.toISOString()).order('fecha', { ascending: false }),
    db.from('gastos').select('importe').gte('fecha', antes.toISOString()).lt('fecha', desde.toISOString())
  ]);
  if (res[0].error) { avisar('No se pudieron cargar los gastos: ' + res[0].error.message); return; }
  gastos = res[0].data || [];
  totalAnterior = (res[1].data || []).reduce(function (s, g) { return s + Number(g.importe); }, 0);
  pintar();
}

function anillo(orden, total) {
  var r = 80, C = 2 * Math.PI * r, acc = 0;
  var s = '<svg viewBox="0 0 200 200" role="img" aria-label="Reparto del gasto por categoría">' +
    '<circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="20"/>';
  if (total > 0) {
    var hueco = orden.length > 1 ? 2.5 : 0;
    orden.forEach(function (par) {
      var largo = (par[1] / total) * C;
      var visible = Math.max(largo - hueco, 0.8);
      s += '<circle class="seg" cx="100" cy="100" r="80" fill="none" stroke="' + info(par[0]).c + '" stroke-width="20"' +
        ' stroke-dasharray="' + visible.toFixed(2) + ' ' + (C - visible).toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 100 100)"/>';
      acc += largo;
    });
  }
  return s + '</svg>';
}

function pintar() {
  var total = gastos.reduce(function (s, g) { return s + Number(g.importe); }, 0);
  var hoy = new Date();
  var esMesActual = mesActual.getFullYear() === hoy.getFullYear() && mesActual.getMonth() === hoy.getMonth();
  var diasMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0).getDate();
  var diasPasados = esMesActual ? hoy.getDate() : diasMes;

  // Total
  var partes = eur.format(total).replace(/\s?€/, '').split(',');
  $('total').innerHTML = esc(partes[0]) + '<small>,' + esc(partes[1] || '00') + ' €</small>';

  // Comparación con el mes anterior
  var comp = $('comp');
  if (totalAnterior > 0) {
    var dif = Math.round(((total - totalAnterior) / totalAnterior) * 100);
    var ant = new Date(mesActual); ant.setMonth(ant.getMonth() - 1);
    comp.hidden = false;
    comp.className = 'comp ' + (dif > 0 ? 'sube' : 'baja');
    comp.textContent = (dif > 0 ? '▲ ' : '▼ ') + Math.abs(dif) + ' % que en ' + soloMes.format(ant);
  } else { comp.hidden = true; }

  // Datos rápidos
  var deducible = gastos.filter(function (g) { return g.deducible; }).reduce(function (s, g) { return s + Number(g.importe); }, 0);
  $('d-num').textContent = gastos.length;
  $('d-media').textContent = eurCorto.format(diasPasados ? total / diasPasados : 0);
  $('d-deduc').textContent = eurCorto.format(deducible);

  // Reparto por categoría
  var porCat = {};
  gastos.forEach(function (g) { var c = catDe(g); porCat[c] = (porCat[c] || 0) + Number(g.importe); });
  var orden = Object.keys(porCat).map(function (c) { return [c, porCat[c]]; }).sort(function (a, b) { return b[1] - a[1]; });
  $('anillo').innerHTML = anillo(orden, total);

  var maxCat = orden.length ? orden[0][1] : 1;
  $('cats').innerHTML = orden.length ? orden.map(function (par) {
    var c = par[0], v = par[1], col = info(c).c;
    return '<div class="cat">' + icono(c) +
      '<span class="nombre">' + esc(c) + '</span>' +
      '<span class="cuanto">' + eur.format(v) + '</span>' +
      '<div class="pista"><span class="riel"><span class="relleno" style="width:' + (v / maxCat * 100).toFixed(1) + '%;background:' + col + '"></span></span>' +
      '<span class="pct">' + Math.round(v / total * 100) + ' %</span></div></div>';
  }).join('') : '<div class="vacio">Sin gastos todavía.</div>';

  // Día a día
  var porDia = [];
  for (var d = 0; d < diasMes; d++) porDia.push(0);
  gastos.forEach(function (g) {
    var f = new Date(g.fecha);
    if (f.getMonth() === mesActual.getMonth()) porDia[f.getDate() - 1] += Number(g.importe);
  });
  var maxDia = Math.max.apply(null, porDia.concat([1]));
  var diaTop = porDia.indexOf(maxDia);
  $('barras').innerHTML = porDia.map(function (v, i) {
    var clase = 'barra' + (v === 0 ? ' cero' : '') + (esMesActual && i + 1 === hoy.getDate() ? ' hoy' : '');
    var alto = v ? Math.max(v / maxDia * 100, 5) : 3;
    return '<div class="' + clase + '" style="height:' + alto.toFixed(1) + '%" title="Día ' + (i + 1) + ': ' + eur.format(v) + '"></div>';
  }).join('');
  $('eje').innerHTML = '<span>1</span><span>' + Math.ceil(diasMes / 2) + '</span><span>' + diasMes + '</span>';
  $('dia-max').textContent = total > 0 ? 'Día más alto: ' + (diaTop + 1) + ', ' + eur.format(maxDia) : '';

  // Por revisar
  var pend = gastos.filter(function (g) { return catDe(g) === 'Sin clasificar'; });
  $('bloque-revisar').hidden = pend.length === 0;
  $('revisar-titulo').textContent = pend.length + (pend.length === 1 ? ' gasto por revisar' : ' gastos por revisar');
  $('pendientes').innerHTML = pend.map(function (g) {
    return '<div class="pendiente" data-id="' + esc(g.id) + '">' +
      '<div class="fila">' + icono('Sin clasificar') +
      '<span>' + esc(g.comercio || 'Sin nombre') + '</span><strong>' + eur.format(g.importe) + '</strong></div>' +
      '<div class="controles"><select aria-label="Categoría">' + opciones('Otros', false) + '</select>' +
      '<input aria-label="Palabra clave de la regla" value="' + esc(palabraSugerida(g.comercio)) + '">' +
      '<button class="btn-peq" data-accion="clasificar">Guardar</button></div></div>';
  }).join('');

  // Movimientos agrupados por día
  if (!gastos.length) {
    $('lista').innerHTML = '<div class="vacio"><span class="grande">🧾</span>No hay gastos en ' + esc(soloMes.format(mesActual)) +
      '. Paga con Apple Pay o usa el atajo "Gasto" y aparecerán aquí.</div>';
    return;
  }
  var ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  var grupos = [], actual = null;
  gastos.forEach(function (g) {
    var f = new Date(g.fecha);
    if (!actual || !mismoDia(actual.fecha, f)) { actual = { fecha: f, items: [], suma: 0 }; grupos.push(actual); }
    actual.items.push(g); actual.suma += Number(g.importe);
  });
  $('lista').innerHTML = grupos.map(function (gr) {
    var etiqueta = mismoDia(gr.fecha, hoy) ? 'Hoy' : mismoDia(gr.fecha, ayer) ? 'Ayer' : diaFmt.format(gr.fecha);
    return '<div class="dia"><div class="dia-cab"><span>' + esc(etiqueta) + '</span><span>' + eur.format(gr.suma) + '</span></div>' +
      gr.items.map(function (g) {
        var c = catDe(g);
        return '<details class="mov" data-id="' + esc(g.id) + '"><summary>' + icono(c) +
          '<span class="txt"><span class="nombre">' + esc(g.comercio || 'Sin nombre') + '</span>' +
          '<span class="sub">' + horaFmt.format(new Date(g.fecha)) + ', ' + esc(c) + (g.deducible ? ', deducible' : '') + '</span></span>' +
          '<span class="imp">' + eur.format(g.importe) + '</span></summary>' +
          '<div class="acc"><select aria-label="Cambiar categoría" data-accion="categoria">' + opciones(c, true) + '</select>' +
          '<button class="chip" data-accion="deducible" aria-pressed="' + (g.deducible ? 'true' : 'false') + '">Deducible</button>' +
          '<button class="borrar" data-accion="borrar">Borrar</button></div></details>';
      }).join('') + '</div>';
  }).join('');
}

/* ---------- Acciones ---------- */
async function clasificar(id, categoria, palabra) {
  palabra = palabra.toUpperCase().replace(/\s+/g, ' ').trim();
  if (palabra.length < 3) { avisar('La palabra clave necesita al menos 3 letras.'); return; }
  var r1 = await db.from('reglas').upsert({ palabra: palabra, categoria: categoria }, { onConflict: 'palabra' });
  if (r1.error) { avisar('No se pudo guardar la regla: ' + r1.error.message); return; }
  var ids = gastos.filter(function (g) {
    return g.id === id || (catDe(g) === 'Sin clasificar' && String(g.comercio || '').toUpperCase().indexOf(palabra) !== -1);
  }).map(function (g) { return g.id; });
  var r2 = await db.from('gastos').update({ categoria: categoria }).in('id', ids);
  if (r2.error) { avisar('No se pudo actualizar: ' + r2.error.message); return; }
  avisar(ids.length > 1 ? 'Regla guardada. ' + ids.length + ' gastos clasificados.' : 'Regla guardada.');
  cargar();
}

document.addEventListener('click', async function (e) {
  var btn = e.target.closest('button[data-accion]');
  if (!btn) return;
  e.preventDefault();
  if (DEMO) { avisar('Modo demostración: no se guarda nada.'); return; }
  var cont = btn.closest('[data-id]');
  var id = cont.dataset.id;
  var accion = btn.dataset.accion;

  if (accion === 'clasificar') {
    clasificar(id, cont.querySelector('select').value, cont.querySelector('input').value);
  }
  if (accion === 'deducible') {
    var nuevo = btn.getAttribute('aria-pressed') !== 'true';
    var r = await db.from('gastos').update({ deducible: nuevo }).eq('id', id);
    if (r.error) { avisar('No se pudo guardar.'); return; }
    gastos.forEach(function (g) { if (g.id === id) g.deducible = nuevo; });
    avisar(nuevo ? 'Marcado como deducible.' : 'Ya no es deducible.');
    pintar();
  }
  if (accion === 'borrar') {
    var g = gastos.filter(function (x) { return x.id === id; })[0];
    if (!confirm('¿Borrar "' + (g.comercio || 'Sin nombre') + '" de ' + eur.format(g.importe) + '? No se puede deshacer.')) return;
    var rb = await db.from('gastos').delete().eq('id', id);
    if (rb.error) { avisar('No se pudo borrar.'); return; }
    avisar('Gasto borrado.');
    cargar();
  }
});

document.addEventListener('change', async function (e) {
  var sel = e.target.closest('select[data-accion="categoria"]');
  if (!sel) return;
  if (DEMO) { avisar('Modo demostración: no se guarda nada.'); return; }
  var id = sel.closest('[data-id]').dataset.id;
  var r = await db.from('gastos').update({ categoria: sel.value }).eq('id', id);
  if (r.error) { avisar('No se pudo cambiar la categoría.'); return; }
  avisar('Categoría cambiada.');
  cargar();
});

$('mes-ant').addEventListener('click', function () { mesActual.setMonth(mesActual.getMonth() - 1); cargar(); });
$('mes-sig').addEventListener('click', function () { mesActual.setMonth(mesActual.getMonth() + 1); cargar(); });
$('recargar').addEventListener('click', cargar);

iniciar();
</script>
