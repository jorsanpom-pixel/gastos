<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F14" media="(prefers-color-scheme: dark)">
<title>Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --fondo: #F2F3F7;
    --tarjeta: #FFFFFF;
    --tinta: #15161C;
    --tenue: #6B6F7E;
    --linea: #E4E6EE;
    --heroe: #23245A;
    --heroe-2: #33358A;
    --heroe-tinta: #F4F4FF;
    --heroe-tenue: #B9BAE8;
    --acento: #5B5CF0;
    --aviso: #E8590C;
    --sube: #FFB4A2;
    --baja: #9EE6B8;
    --ok: #16A34A;
    --radio: 20px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0E0F14;
      --tarjeta: #181A22;
      --tinta: #EDEEF4;
      --tenue: #9296A8;
      --linea: #262936;
      --heroe: #26286A;
      --heroe-2: #3A3CA0;
      --acento: #8183FF;
      --aviso: #FF8A4C;
      --ok: #4ADE80;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 56px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  /* ---------- Acceso ---------- */
  .login { min-height: 80vh; display: grid; align-content: center; gap: 14px; max-width: 380px; margin: 0 auto; }
  .login h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 44px; line-height: 1; letter-spacing: -0.03em; margin: 0; }
  .login p { margin: 0 0 10px; color: var(--tenue); }
  .campo { display: grid; gap: 6px; font-size: 14px; color: var(--tenue); }
  .campo input {
    padding: 14px; border: 1px solid var(--linea); border-radius: 14px;
    background: var(--tarjeta); color: var(--tinta); font-size: 16px;
  }
  .btn {
    padding: 14px 16px; border-radius: 14px; border: 0;
    background: var(--acento); color: #fff; font-weight: 600; font-size: 16px;
  }
  .error { color: var(--aviso); font-size: 14px; min-height: 20px; }

  /* ---------- Héroe: mes, anillo y total ---------- */
  .heroe {
    position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, var(--heroe-2) 0%, var(--heroe) 60%);
    color: var(--heroe-tinta);
    border-radius: 28px; padding: 16px 16px 20px;
  }
  .heroe-cab { display: flex; align-items: center; justify-content: space-between; }
  .heroe-cab h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .flecha {
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.12); color: var(--heroe-tinta); font-size: 22px; line-height: 1;
  }
  .flecha:active { background: rgba(255,255,255,.22); }
  .anillo-caja { position: relative; width: min(270px, 74vw); aspect-ratio: 1; margin: 10px auto 6px; }
  .anillo-caja svg { width: 100%; height: 100%; display: block; }
  .anillo-caja circle.seg { transition: stroke-dasharray .6s ease, stroke-dashoffset .6s ease; }
  .centro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; }
  .centro .etq { font-size: 13px; color: var(--heroe-tenue); }
  .cifra { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.035em; }
  .cifra small { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .comp { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; justify-self: center; background: rgba(255,255,255,.1); }
  .comp.sube { color: var(--sube); }
  .comp.baja { color: var(--baja); }
  .datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .dato { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px; text-align: center; }
  .dato b { display: block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .dato span { font-size: 12px; color: var(--heroe-tenue); }
  .dato b.pos { color: var(--baja); }
  .dato b.neg { color: var(--sube); }

  /* ---------- Tarjetas ---------- */
  .tarjeta { background: var(--tarjeta); border-radius: var(--radio); padding: 16px; margin-top: 14px; }
  .tarjeta h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .tarjeta-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .tarjeta-cab .nota { font-size: 13px; color: var(--tenue); }

  /* Día a día */
  .barras { display: flex; align-items: flex-end; gap: 3px; height: 110px; }
  .barra { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--acento); min-height: 3px; transition: height .5s ease; }
  .barra.cero { background: var(--linea); }
  .barra.hoy { background: var(--aviso); }
  .eje { display: flex; justify-content: space-between; font-size: 11px; color: var(--tenue); margin-top: 6px; }

  /* Categorías */
  .cats { display: grid; gap: 14px; }
  .cat { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; }
  .ico {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    font-size: 21px; line-height: 1; grid-row: span 2;
  }
  .cat .nombre { font-weight: 600; }
  .cat .cuanto { text-align: right; font-weight: 600; }
  .cat .pista { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; }
  .pista .riel { flex: 1; height: 8px; border-radius: 999px; background: var(--linea); overflow: hidden; }
  .pista .relleno { display: block; height: 100%; border-radius: 999px; transition: width .6s ease; }
  .pista .pct { font-size: 12px; color: var(--tenue); width: 38px; text-align: right; }
  .pp .pista { display: grid; grid-template-columns: 1fr; gap: 4px; }

  /* Leyenda del anillo */
  .leyenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 12px; color: var(--heroe-tenue); margin: 2px 0 6px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Balance */
  .linea-bal { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; font-size: 15px; }
  .linea-bal .etq-bal { color: var(--tenue); }
  .linea-bal b { font-weight: 600; }
  .linea-bal.total { border-top: 1px solid var(--linea); margin-top: 4px; padding-top: 11px; }
  .linea-bal.total .etq-bal { color: var(--tinta); font-weight: 600; }
  .linea-bal.total b { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 20px; font-weight: 700; }
  .linea-bal.libre b { color: var(--ok); }
  .linea-bal.libre.rojo b { color: var(--aviso); }
  .sep-bal { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tenue); margin: 16px 0 2px; }
  .nota-bal { font-size: 13px; color: var(--tenue); margin: 10px 0 0; }

  /* Presupuesto */
  .grupo + .grupo { margin-top: 22px; }
  .grupo-cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tenue); margin-bottom: 10px; }
  .grupo-cab span:last-child { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .fijo { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
  .fijo + .fijo { margin-top: 10px; }
  .fijo .nombre { font-weight: 600; }
  .fijo .sub { display: block; font-size: 13px; color: var(--tenue); }
  .fijo .ico { grid-row: auto; }
  .estado { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .estado.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  button.estado { border: 0; cursor: pointer; font-family: inherit; }
  .estado-caja { display: grid; justify-items: end; gap: 4px; }
  .marcar { border: 0; background: none; padding: 2px 0; font-size: 12px; font-weight: 600; color: var(--acento); }
  .estado.pend { background: color-mix(in srgb, var(--aviso) 14%, transparent); color: var(--aviso); }
  .pp .queda { font-size: 13px; color: var(--tenue); }
  .pp .queda.pasado { color: var(--aviso); font-weight: 600; }
  .pp .cuanto small { font-weight: 500; color: var(--tenue); }
  .relleno.aviso { background: var(--aviso) !important; }
  .meta-caja + .meta-caja { margin-top: 14px; }
  .meta-cab { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .meta-cab b { font-weight: 600; }
  .meta-cab span { color: var(--tenue); }
  .riel-meta { height: 10px; border-radius: 999px; background: var(--linea); overflow: hidden; }
  .riel-meta span { display: block; height: 100%; border-radius: 999px; background: var(--ok); transition: width .6s ease; }
  .fuera { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .fuera span:first-child { color: var(--tenue); }

  /* Editor del presupuesto */
  .editor, .editor * { box-sizing: border-box; }
  .editor { margin-top: 22px; border-top: 1px solid var(--linea); padding-top: 12px; }
  .editor summary { cursor: pointer; font-weight: 600; color: var(--acento); list-style: none; padding: 6px 0; }
  .editor summary::-webkit-details-marker { display: none; }
  .editor summary::before { content: "✎ "; }
  .campo-pres { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 12px; padding: 5px 0; font-size: 14px; }
  .campo-pres input { min-width: 0; padding: 9px 10px; border: 1px solid var(--linea); border-radius: 12px; background: var(--fondo); text-align: right; font-size: 15px; }
  .editor .btn { width: 100%; margin-top: 14px; }

  /* Por revisar */
  .revisar { border: 2px solid var(--aviso); }
  .revisar h3 { color: var(--aviso); }
  .revisar p { margin: 0 0 14px; font-size: 14px; color: var(--tenue); }
  .pendiente { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--linea); }
  .pendiente:first-child { border-top: 0; padding-top: 0; }
  .pendiente .fila { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
  .pendiente .fila .ico { grid-row: auto; }
  .pendiente .controles { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .pendiente input, .pendiente select, .acc select {
    min-width: 0; padding: 10px; border: 1px solid var(--linea); border-radius: 12px;
    background: var(--fondo); font-size: 14px;
  }
  .btn-peq { padding: 10px 14px; border-radius: 12px; border: 0; background: var(--aviso); color: #fff; font-weight: 600; font-size: 14px; }

  /* Movimientos */
  .dia + .dia { margin-top: 18px; }
  .dia-cab { display: flex; justify-content: space-between; font-size: 13px; color: var(--tenue); padding: 0 2px 8px; }
  .dia-cab span:first-child::first-letter { text-transform: uppercase; }
  .mov { border-radius: 16px; }
  .mov + .mov { margin-top: 4px; }
  .mov summary {
    list-style: none; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
    padding: 8px; border-radius: 16px; cursor: pointer;
  }
  .mov summary::-webkit-details-marker { display: none; }
  .mov summary .ico { grid-row: auto; }
  .mov[open] { background: var(--fondo); }
  .mov .txt { min-width: 0; display: grid; }
  .mov .nombre { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .sub { font-size: 13px; color: var(--tenue); }
  .mov.ingreso .imp, .mas { color: var(--ok); }
  .mov .imp { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 17px; }
  .acc { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 8px 12px 64px; }
  .chip {
    border: 1px solid var(--linea); border-radius: 999px; padding: 8px 14px;
    background: var(--tarjeta); font-size: 13px; color: var(--tenue);
  }
  .chip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .borrar { margin-left: auto; border: 0; background: none; color: var(--aviso); font-size: 13px; font-weight: 600; padding: 8px; }
  .vacio { text-align: center; padding: 24px 8px 12px; color: var(--tenue); }
  .vacio .grande { font-size: 40px; display: block; margin-bottom: 8px; }

  .pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--tenue); font-size: 13px; margin-top: 22px; padding: 0 4px; }
  .enlace { border: 0; background: none; color: var(--tenue); text-decoration: underline; font-size: 13px; padding: 6px 0; }
  .aviso-flotante {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px);
    background: var(--tinta); color: var(--fondo); padding: 12px 18px; border-radius: 14px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center;
  }
  .aviso-flotante.visible { opacity: 1; transform: translate(-50%, 0); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <!-- Acceso -->
  <form id="vista-login" class="login" hidden>
    <h1>Tus gastos</h1>
    <p>Entra con el email y la contraseña de tu usuario de Supabase.</p>
    <label class="campo">Email
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label class="campo">Contraseña
      <input id="pass" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Entrar</button>
    <div id="login-error" class="error" role="alert"></div>
  </form>

  <!-- Panel -->
  <div id="vista-app" hidden>
    <section class="heroe">
      <div class="heroe-cab">
        <button class="flecha" id="mes-ant" aria-label="Mes anterior">‹</button>
        <h2 id="mes-nombre"></h2>
        <button class="flecha" id="mes-sig" aria-label="Mes siguiente">›</button>
      </div>
      <div class="anillo-caja">
        <div id="anillo"></div>
        <div class="centro">
          <span class="etq" id="centro-etq">Puedes gastar</span>
          <span class="cifra" id="total"></span>
          <span class="comp" id="comp" hidden></span>
        </div>
      </div>
      <div class="leyenda" id="leyenda"></div>
      <div class="datos">
        <div class="dato"><b id="d-ing"></b><span>ingresos</span></div>
        <div class="dato"><b id="d-gas"></b><span>gastado</span></div>
        <div class="dato"><b id="d-bal"></b><span>balance</span></div>
      </div>
    </section>

    <section class="tarjeta revisar" id="bloque-revisar" hidden>
      <div class="tarjeta-cab"><h3 id="revisar-titulo"></h3></div>
      <p>Elige la categoría y la palabra que identifica al comercio. Se guarda como regla y la próxima vez se clasifica solo.</p>
      <div id="pendientes"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Balance del mes</h3><span class="nota" id="cats-nota"></span></div>
      <div id="balance"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Presupuesto</h3><span class="nota" id="pres-nota"></span></div>
      <div id="presupuesto"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Gasto por día</h3><span class="nota" id="dia-max"></span></div>
      <div class="barras" id="barras"></div>
      <div class="eje" id="eje"></div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cab"><h3>Movimientos</h3><button class="enlace" id="recargar">Actualizar</button></div>
      <div id="lista"></div>
    </section>

    <div class="pie">
      <span id="usuario"></span>
      <button class="enlace" id="salir">Cerrar sesión</button>
    </div>
  </div>
</main>
<div class="aviso-flotante" id="aviso" role="status"></div>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function info(c) { return CATS[c] || CATS['Otros']; }
// Quita emojis y símbolos ("Alimentación 🥗" -> "Alimentación") para que cuadre con CATS y el presupuesto
function limpiarCat(c) { return String(c || '').replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim(); }
function catDe(g) { return limpiarCat(g.categoria) || 'Sin clasificar'; }
function suma(lista) { return lista.reduce(function (s, g) { return s + Number(g.importe); }, 0); }
function icono(c) { var x = info(c); return '<span class="ico" style="background:' + x.c + '26">' + x.i + '</span>'; }

function avisar(texto) {
  var a = $('aviso');
  a.textContent = texto;
  a.classList.add('visible');
  clearTimeout(avisar.t);
  avisar.t = setTimeout(function () { a.classList.remove('visible'); }, 2400);
}

function opciones(sel, incluirSin) {
  var lista = incluirSin === 'ingreso' ? INGRESOS : incluirSin ? ELEGIBLES.concat(['Sin clasificar']) : ELEGIBLES;
  return lista.map(function (c) {
    return '<option ' + (c === sel ? 'selected' : '') + ' value="' + esc(c) + '">' + info(c).i + ' ' + esc(c) + '</option>';
  }).join('');
}

// Palabra clave sugerida: el comercio en mayúsculas, sin números ni espacios de sobra
function palabraSugerida(comercio) {
  return String(comercio || '').toUpperCase().replace(/[0-9*#]+/g, ' ').replace(/\s+/g, ' ').trim();
}

function mismoDia(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

/* ---------- Sesión ---------- */
async function iniciar() {
  if (DEMO) { mostrarApp({ user: { email: 'Modo demostración' } }); return; }
  var r = await db.auth.getSession();
  if (r.data.session) mostrarApp(r.data.session); else mostrarLogin();
}
function mostrarLogin() { $('vista-app').hidden = true; $('vista-login').hidden = false; }
function mostrarApp(session) {
  $('vista-login').hidden = true;
  $('vista-app').hidden = false;
  $('usuario').textContent = session.user.email;
  cargar();
}

$('vista-login').addEventListener('submit', async function (e) {
  e.preventDefault();
  $('login-error').textContent = '';
  var r = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (r.error) { $('login-error').textContent = 'Email o contraseña incorrectos.'; return; }
  mostrarApp(r.data.session);
});
$('salir').addEventListener('click', async function () {
  if (DEMO) { location.href = location.pathname; return; }
  await db.auth.signOut(); mostrarLogin();
});

/* ---------- Datos ---------- */
function demoDatos() {
  var hoy = new Date();
  var esMesActual = mesActual.getFullYear() === hoy.getFullYear() && mesActual.getMonth() === hoy.getMonth();
  var tope = esMesActual ? hoy.getDate() : new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0).getDate();
  var base = [
    ['Nómina', 1445.85, 'Nómina', 1, 'ingreso'], ['Alquiler', 717.00, 'Vivienda', 1], ['Cuota autónomo', 88.56, 'Cuota autónomo', 1],
    ['Wifi', 11.00, 'Telefonía', 1], ['Agua', 37.50, 'Suministros', 1], ['Trade Republic', 300.00, 'Ahorro', 2],
    ['MERCADONA 2341', 32.35, 'Alimentación 🥗', 3], ['Tren', 24.00, 'Transporte 🚗', 4], ['Kebab', 9.50, 'Ocio 🎯', 5],
    ['CLAUDE.AI', 21.78, 'Suscripciones', 6], ['INVERSIONES LEVANTE SL', 9.40, 'Sin clasificar', 6],
    ['ZARA', 39.95, 'Ropa', 8], ['Factura cliente web', 200.00, 'Facturación', 9, 'ingreso'], ['CONSUM', 41.80, 'Alimentación', 12],
    ['Cine', 14.00, 'Ocio', 14], ['Luz', 48.20, 'Suministros', 15], ['APPLE.COM/BILL', 2.99, 'Suscripciones', 28]
  ];
  return base.filter(function (b) { return b[3] <= tope; }).map(function (b, n) {
    var f = new Date(mesActual.getFullYear(), mesActual.getMonth(), b[3], 10 + (n % 9), (n * 7) % 60);
    return { id: 'demo' + n, fecha: f.toISOString(), importe: b[1], comercio: b[0], categoria: b[2], deducible: b[2] === 'Cuota autónomo', origen: 'demo', tipo: b[4] || 'gasto' };
  }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
}

async function cargar() {
  var nm = nombreMes.format(mesActual); $('mes-nombre').textContent = nm.charAt(0).toUpperCase() + nm.slice(1);
  if (DEMO) { movs = demoDatos(); totalAnterior = 1090; colchonTotal = 400; pintar(); return; }
  var desde = new Date(mesActual);
  var hasta = new Date(mesActual); hasta.setMonth(hasta.getMonth() + 1);
  var antes = new Date(mesActual); antes.setMonth(antes.getMonth() - 1);
  var res = await Promise.all([
    db.from('gastos').select('*').gte('fecha', desde.toISOString()).lt('fecha', hasta.toISOString()).order('fecha', { ascending: false }),
    db.from('gastos').select('importe, tipo').gte('fecha', antes.toISOString()).lt('fecha', desde.toISOString()),
    // Colchón: todo lo apuntado en "Ahorro" hasta el final del mes que se ve; un ingreso en "Ahorro" es una retirada
    db.from('gastos').select('importe, tipo').ilike('categoria', 'Ahorro%').lt('fecha', hasta.toISOString()),
    db.from('ajustes').select('clave, valor').in('clave', ['presupuesto', 'pagados'])
  ]);
  if (res[0].error) { avisar('No se pudieron cargar los gastos: ' + res[0].error.message); return; }
  movs = res[0].data || [];
  totalAnterior = suma((res[1].data || []).filter(function (g) { return g.tipo !== 'ingreso'; }));
  colchonTotal = (res[2].data || []).reduce(function (s, g) { return s + (g.tipo === 'ingreso' ? -1 : 1) * Number(g.importe); }, 0);
  // Si la tabla "ajustes" aún no existe, se usa el presupuesto por defecto de arriba
  tablaAjustes = !res[3].error;
  var aj = {};
  (res[3].data || []).forEach(function (r) { aj[r.clave] = r.valor; });
  presupuestoEnNube = !!aj.presupuesto;
  if (presupuestoEnNube) PRESUPUESTO = Object.assign({}, PRESUPUESTO, aj.presupuesto);
  pagados = aj.pagados || {};
  pintar();
}

function anillo(orden, total) {
  var r = 80, C = 2 * Math.PI * r, acc = 0;
  var s = '<svg viewBox="0 0 200 200" role="img" aria-label="Reparto del gasto por categoría">' +
    '<circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="20"/>';
  if (total > 0) {
    var hueco = orden.length > 1 ? 2.5 : 0;
    orden.forEach(function (par) {
      var largo = (par[1] / total) * C;
      var visible = Math.max(largo - hueco, 0.8);
      s += '<circle class="seg" cx="100" cy="100" r="80" fill="none" stroke="' + par[0] + '" stroke-width="20"' +
        ' stroke-dasharray="' + visible.toFixed(2) + ' ' + (C - visible).toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 100 100)"/>';
      acc += largo;
    });
  }
  return s + '</svg>';
}

function pintar() {
  gastos = movs.filter(function (g) { return g.tipo !== 'ingreso'; });
  var ingresos = movs.filter(function (g) { return g.tipo === 'ingreso'; });
  var totalIng = suma(ingresos);
  var total = suma(gastos);
  var hoy = new Date();
  var esMesActual = mesActual.getFullYear() === hoy.getFullYear() && mesActual.getMonth() === hoy.getMonth();
  var esPasado = mesActual < new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  var diasMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0).getDate();
  var diasRestantes = esMesActual ? diasMes - hoy.getDate() + 1 : esPasado ? 0 : diasMes;
  var P = PRESUPUESTO;

  // Gasto por categoría (sin emojis) y cuentas del presupuesto
  var porCat = {};
  gastos.forEach(function (g) { var c = catDe(g); porCat[c] = (porCat[c] || 0) + Number(g.importe); });
  function gastado(c) { return porCat[c] || 0; }
  var fijosPag = 0, fijosPend = 0, fijosTotal = 0;
  Object.keys(P.fijos).forEach(function (c) {
    fijosPag += gastado(c); fijosTotal += P.fijos[c];
    if (!marcadoPagado(c)) fijosPend += Math.max(0, P.fijos[c] - gastado(c));
  });
  var ahorroMes = gastado('Ahorro');
  var ahorroPend = Math.max(0, P.ahorro - ahorroMes);
  var diaADia = total - fijosPag - ahorroMes;
  var balance = totalIng - total;
  var libre = esPasado ? balance : balance - fijosPend - ahorroPend;

  // Héroe: lo que queda libre (mes en curso) o el balance final (meses pasados)
  $('centro-etq').textContent = esPasado ? 'Balance del mes' : 'Puedes gastar';
  var partes = eur.format(libre).replace(/\s?€/, '').split(',');
  $('total').innerHTML = esc(partes[0]) + '<small>,' + esc(partes[1] || '00') + ' €</small>';
  var comp = $('comp');
  comp.hidden = false;
  if (!esPasado && libre <= 0) {
    comp.className = 'comp sube'; comp.textContent = 'Presupuesto agotado';
  } else if (!esPasado && diasRestantes) {
    comp.className = 'comp baja'; comp.textContent = '≈ ' + eurCorto.format(libre / diasRestantes) + ' al día · ' + diasRestantes + (diasRestantes === 1 ? ' día' : ' días');
  } else if (totalAnterior > 0) {
    var dif = Math.round(((total - totalAnterior) / totalAnterior) * 100);
    var ant = new Date(mesActual); ant.setMonth(ant.getMonth() - 1);
    comp.className = 'comp ' + (dif > 0 ? 'sube' : 'baja');
    comp.textContent = (dif > 0 ? '▲ ' : '▼ ') + Math.abs(dif) + ' % de gasto que en ' + soloMes.format(ant);
  } else { comp.hidden = true; }

  // Anillo: qué parte de tus ingresos se va a fijos, día a día y ahorro; el hueco es lo libre
  var base = Math.max(totalIng, P.ingresos, total);
  var segs = esPasado
    ? [[GRUPOS.fijos.c, fijosPag], [GRUPOS.variables.c, diaADia], [GRUPOS.ahorro.c, ahorroMes]]
    : [[GRUPOS.fijos.c, fijosPag + fijosPend], [GRUPOS.variables.c, diaADia], [GRUPOS.ahorro.c, ahorroMes + ahorroPend]];
  $('anillo').innerHTML = anillo(segs.filter(function (s) { return s[1] > 0; }), base);
  $('leyenda').innerHTML = ['fijos', 'variables', 'ahorro'].map(function (k, i) {
    return '<span><i style="background:' + GRUPOS[k].c + '"></i>' + GRUPOS[k].n + ' ' + eurCorto.format(segs[i][1]) + '</span>';
  }).join('') + '<span><i style="background:rgba(255,255,255,.18)"></i>Libre</span>';

  // Datos rápidos
  $('d-ing').textContent = eurCorto.format(totalIng);
  $('d-gas').textContent = eurCorto.format(total);
  $('d-bal').textContent = (balance > 0 ? '+' : '') + eurCorto.format(balance);
  $('d-bal').className = balance >= 0 ? 'pos' : 'neg';
  var deducible = suma(gastos.filter(function (g) { return g.deducible; }));
  $('cats-nota').textContent = deducible ? eur.format(deducible) + ' deducibles' : '';

  // Balance del mes
  function linea(etq, v, clase) {
    return '<div class="linea-bal ' + (clase || '') + '"><span class="etq-bal">' + etq + '</span><b>' +
      (v > 0 && !clase ? '+' : '') + eur.format(v) + '</b></div>';
  }
  var htmlBal = linea('Ingresos', totalIng) + linea('Gastos fijos', -fijosPag) + linea('Día a día y otros', -diaADia) +
    linea('Ahorro', -ahorroMes) + linea('Balance', balance, 'total');
  if (!esPasado && (fijosPend > 0 || ahorroPend > 0)) {
    htmlBal += '<div class="sep-bal">Aún por salir</div>' +
      (fijosPend > 0 ? linea('Fijos pendientes', -fijosPend) : '') +
      (ahorroPend > 0 ? linea('Ahorro pendiente', -ahorroPend) : '') +
      linea('Libre para gastar', libre, 'total libre' + (libre < 0 ? ' rojo' : ''));
  }
  var notas = [];
  if (!esPasado && totalIng < P.ingresos) notas.push('Te faltan ' + eur.format(P.ingresos - totalIng) + ' para tus ingresos previstos (' + eur.format(P.ingresos) + ').');
  if (totalAnterior > 0 && !esPasado) notas.push('Mes anterior: ' + eur.format(totalAnterior) + ' gastados.');
  $('balance').innerHTML = htmlBal + (notas.length ? '<p class="nota-bal">' + esc(notas.join(' ')) + '</p>' : '');

  // Presupuesto por apartados
  var hPres = '<div class="grupo"><div class="grupo-cab"><span>Fijos</span><span>' + eur.format(fijosPag) + ' de ' + eur.format(fijosTotal) + '</span></div>' +
    Object.keys(P.fijos).map(function (c) {
      var L = P.fijos[c], s = gastado(c), falta = L - s, aMano = marcadoPagado(c);
      var estado = falta <= 0.5 ? '<span class="estado ok">Pagado</span>'
        : aMano ? '<button class="estado ok" data-pagado="' + esc(c) + '" title="Quitar la marca">Pagado ✓</button>'
        : '<span class="estado-caja"><span class="estado pend">Falta ' + eur.format(falta) + '</span><button class="marcar" data-pagado="' + esc(c) + '">Marcar pagado</button></span>';
      return '<div class="fijo">' + icono(c) + '<span><span class="nombre">' + esc(c) + '</span><span class="sub">' +
        eur.format(s) + ' de ' + eur.format(L) + (aMano && falta > 0.5 ? ' · marcado a mano' : '') + '</span></span>' + estado + '</div>';
    }).join('') + '</div>';

  var varTotal = 0, varQueda = 0;
  Object.keys(P.variables).forEach(function (c) { varTotal += P.variables[c]; varQueda += Math.max(0, P.variables[c] - gastado(c)); });
  hPres += '<div class="grupo"><div class="grupo-cab"><span>Día a día</span><span>quedan ' + eur.format(varQueda) + ' de ' + eur.format(varTotal) + '</span></div><div class="cats">' +
    Object.keys(P.variables).map(function (c) {
      var L = P.variables[c], s = gastado(c), resto = L - s, pct = L ? s / L * 100 : 0;
      var queda = resto >= 0
        ? 'Quedan ' + eur.format(resto) + (diasRestantes && resto > 0 ? ' · ' + eur.format(resto / diasRestantes) + '/día' : '')
        : 'Te has pasado ' + eur.format(-resto);
      return '<div class="cat pp">' + icono(c) + '<span class="nombre">' + esc(c) + '</span>' +
        '<span class="cuanto">' + eur.format(s) + ' <small>/ ' + eurCorto.format(L) + '</small></span>' +
        '<div class="pista"><span class="riel"><span class="relleno' + (pct >= 90 ? ' aviso' : '') + '" style="width:' + Math.min(100, pct).toFixed(1) + '%;background:' + info(c).c + '"></span></span>' +
        '<span class="queda' + (resto < 0 ? ' pasado' : '') + '">' + queda + '</span></div></div>';
    }).join('') + '</div></div>';

  hPres += '<div class="grupo"><div class="grupo-cab"><span>Ahorro</span><span>Trade Republic</span></div>' +
    '<div class="meta-caja"><div class="meta-cab"><b>Meta del mes</b><span>' + eur.format(ahorroMes) + ' / ' + eur.format(P.ahorro) + '</span></div>' +
    '<div class="riel-meta"><span style="width:' + Math.min(100, ahorroMes / P.ahorro * 100).toFixed(1) + '%"></span></div></div>' +
    '<div class="meta-caja"><div class="meta-cab"><b>Colchón de emergencia</b><span>' + eur.format(colchonTotal) + ' / ' + eur.format(P.colchon) + '</span></div>' +
    '<div class="riel-meta"><span style="width:' + Math.max(0, Math.min(100, colchonTotal / P.colchon * 100)).toFixed(1) + '%"></span></div></div></div>';

  var fuera = Object.keys(porCat).filter(function (c) { return !(c in P.fijos) && !(c in P.variables) && c !== 'Ahorro'; })
    .sort(function (a, b) { return porCat[b] - porCat[a]; });
  if (fuera.length) {
    hPres += '<div class="grupo"><div class="grupo-cab"><span>Fuera del presupuesto</span><span>' + eur.format(suma(fuera.map(function (c) { return { importe: porCat[c] }; }))) + '</span></div>' +
      fuera.map(function (c) { return '<div class="fuera"><span>' + info(c).i + ' ' + esc(c) + '</span><span>' + eur.format(porCat[c]) + '</span></div>'; }).join('') + '</div>';
  }
  $('presupuesto').innerHTML = hPres + editorPresupuesto(P);
  $('guardar-pres').onclick = guardarPresupuesto;
  $('pres-nota').textContent = esMesActual ? diasRestantes + (diasRestantes === 1 ? ' día por delante' : ' días por delante') : '';

  // Día a día
  var porDia = [];
  for (var d = 0; d < diasMes; d++) porDia.push(0);
  gastos.forEach(function (g) {
    var f = new Date(g.fecha);
    if (f.getMonth() === mesActual.getMonth()) porDia[f.getDate() - 1] += Number(g.importe);
  });
  var maxDia = Math.max.apply(null, porDia.concat([1]));
  var diaTop = porDia.indexOf(maxDia);
  $('barras').innerHTML = porDia.map(function (v, i) {
    var clase = 'barra' + (v === 0 ? ' cero' : '') + (esMesActual && i + 1 === hoy.getDate() ? ' hoy' : '');
    var alto = v ? Math.max(v / maxDia * 100, 5) : 3;
    return '<div class="' + clase + '" style="height:' + alto.toFixed(1) + '%" title="Día ' + (i + 1) + ': ' + eur.format(v) + '"></div>';
  }).join('');
  $('eje').innerHTML = '<span>1</span><span>' + Math.ceil(diasMes / 2) + '</span><span>' + diasMes + '</span>';
  $('dia-max').textContent = total > 0 ? 'Máximo el día ' + (diaTop + 1) + ': ' + eur.format(maxDia) : '';

  // Por revisar
  var pend = gastos.filter(function (g) { return catDe(g) === 'Sin clasificar'; });
  $('bloque-revisar').hidden = pend.length === 0;
  $('revisar-titulo').textContent = pend.length + (pend.length === 1 ? ' gasto por revisar' : ' gastos por revisar');
  $('pendientes').innerHTML = pend.map(function (g) {
    return '<div class="pendiente" data-id="' + esc(g.id) + '">' +
      '<div class="fila">' + icono('Sin clasificar') +
      '<span>' + esc(g.comercio || 'Sin nombre') + '</span><strong>' + eur.format(g.importe) + '</strong></div>' +
      '<div class="controles"><select aria-label="Categoría">' + opciones('Otros', false) + '</select>' +
      '<input aria-label="Palabra clave de la regla" value="' + esc(palabraSugerida(g.comercio)) + '">' +
      '<button class="btn-peq" data-accion="clasificar">Guardar</button></div></div>';
  }).join('');

  // Movimientos agrupados por día
  if (!movs.length) {
    $('lista').innerHTML = '<div class="vacio"><span class="grande">🧾</span>No hay movimientos en ' + esc(soloMes.format(mesActual)) +
      '. Paga con Apple Pay o usa el atajo "Gasto" y aparecerán aquí.</div>';
    return;
  }
  var ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  var grupos = [], actual = null;
  movs.forEach(function (g) {
    var f = new Date(g.fecha);
    if (!actual || !mismoDia(actual.fecha, f)) { actual = { fecha: f, items: [], suma: 0, ing: 0 }; grupos.push(actual); }
    actual.items.push(g);
    if (g.tipo === 'ingreso') actual.ing += Number(g.importe); else actual.suma += Number(g.importe);
  });
  $('lista').innerHTML = grupos.map(function (gr) {
    var etiqueta = mismoDia(gr.fecha, hoy) ? 'Hoy' : mismoDia(gr.fecha, ayer) ? 'Ayer' : diaFmt.format(gr.fecha);
    return '<div class="dia"><div class="dia-cab"><span>' + esc(etiqueta) + '</span><span>' + (gr.ing ? '<span class="mas">+' + eur.format(gr.ing) + '</span> ' : '') + (gr.suma ? eur.format(gr.suma) : '') + '</span></div>' +
      gr.items.map(function (g) {
        var esIng = g.tipo === 'ingreso';
        var c = esIng ? (g.categoria || 'Otros ingresos') : catDe(g);
        return '<details class="mov' + (esIng ? ' ingreso' : '') + '" data-id="' + esc(g.id) + '"><summary>' + icono(c) +
          '<span class="txt"><span class="nombre">' + esc(g.comercio || 'Sin nombre') + '</span>' +
          '<span class="sub">' + horaFmt.format(new Date(g.fecha)) + ', ' + esc(c) + (g.deducible ? ', deducible' : '') + '</span></span>' +
          '<span class="imp">' + (esIng ? '+' : '') + eur.format(g.importe) + '</span></summary>' +
          '<div class="acc"><select aria-label="Cambiar categoría" data-accion="categoria">' + opciones(c, esIng ? 'ingreso' : true) + '</select>' +
          (esIng ? '' : '<button class="chip" data-accion="deducible" aria-pressed="' + (g.deducible ? 'true' : 'false') + '">Deducible</button>') +
          '<button class="borrar" data-accion="borrar">Borrar</button></div></details>';
      }).join('') + '</div>';
  }).join('');
}

/* ---------- Editar presupuesto (tabla "ajustes" de Supabase) ---------- */
function editorPresupuesto(P) {
  function campo(etq, grupo, clave, valor, paso) {
    return '<label class="campo-pres"><span>' + esc(etq) + '</span><input type="number" inputmode="decimal" min="0" step="' + (paso || '0.01') +
      '" data-grupo="' + grupo + '" data-clave="' + esc(clave) + '" value="' + valor + '"></label>';
  }
  function bloque(titulo, grupo, obj) {
    return '<div class="sep-bal">' + titulo + '</div>' + Object.keys(obj).map(function (c) { return campo(info(c).i + ' ' + c, grupo, c, obj[c]); }).join('');
  }
  return '<details class="editor"><summary>Editar presupuesto</summary>' +
    '<div class="sep-bal">General</div>' +
    campo('Ingresos previstos al mes', 'raiz', 'ingresos', P.ingresos) +
    campo('Ahorro al mes', 'raiz', 'ahorro', P.ahorro) +
    campo('Meta del colchón', 'raiz', 'colchon', P.colchon) +
    bloque('Fijos', 'fijos', P.fijos) + bloque('Día a día', 'variables', P.variables) +
    '<button class="btn" id="guardar-pres" type="button">Guardar presupuesto</button>' +
    '<p class="nota-bal">' + (presupuestoEnNube ? 'Se guarda en Supabase: lo verán la web y el dashboard.' :
      'Aún no existe la tabla "ajustes" en Supabase; hasta crearla se usa el presupuesto por defecto.') + '</p></details>';
}

async function guardarPresupuesto() {
  if (DEMO) { avisar('Modo demostración: no se guarda nada.'); return; }
  var nuevo = JSON.parse(JSON.stringify(PRESUPUESTO));
  var mal = false;
  document.querySelectorAll('.editor input[data-grupo]').forEach(function (inp) {
    var v = Number(String(inp.value).replace(',', '.'));
    if (!isFinite(v) || v < 0 || inp.value === '') { mal = true; return; }
    if (inp.dataset.grupo === 'raiz') nuevo[inp.dataset.clave] = v;
    else nuevo[inp.dataset.grupo][inp.dataset.clave] = v;
  });
  if (mal) { avisar('Revisa los importes: tienen que ser números de 0 en adelante.'); return; }
  var r = await db.from('ajustes').upsert({ clave: 'presupuesto', valor: nuevo, actualizado: new Date().toISOString() }, { onConflict: 'clave' });
  if (r.error) { avisar('No se pudo guardar. ¿Has creado la tabla "ajustes" en Supabase?'); return; }
  avisar('Presupuesto guardado.');
  cargar();
}

// Marcar / desmarcar un fijo como pagado este mes (cuando ha salido por menos de lo presupuestado)
document.addEventListener('click', async function (e) {
  var btn = e.target.closest('button[data-pagado]');
  if (!btn) return;
  e.preventDefault();
  if (DEMO) { avisar('Modo demostración: no se guarda nada.'); return; }
  if (!tablaAjustes) { avisar('Para guardar la marca, crea primero la tabla "ajustes" en Supabase.'); return; }
  var c = btn.dataset.pagado, mes = claveMes();
  var nuevo = JSON.parse(JSON.stringify(pagados));
  var lista = nuevo[mes] || [];
  nuevo[mes] = lista.indexOf(c) === -1 ? lista.concat([c]) : lista.filter(function (x) { return x !== c; });
  var r = await db.from('ajustes').upsert({ clave: 'pagados', valor: nuevo, actualizado: new Date().toISOString() }, { onConflict: 'clave' });
  if (r.error) { avisar('No se pudo guardar la marca.'); return; }
  avisar(nuevo[mes].indexOf(c) !== -1 ? c + ' marcado como pagado este mes.' : 'Marca quitada.');
  cargar();
});

/* ---------- Acciones ---------- */
async function clasificar(id, categoria, palabra) {
  palabra = palabra.toUpperCase().replace(/\s+/g, ' ').trim();
  if (palabra.length < 3) { avisar('La palabra clave necesita al menos 3 letras.'); return; }
  var r1 = await db.from('reglas').upsert({ palabra: palabra, categoria: categoria }, { onConflict: 'palabra' });
  if (r1.error) { avisar('No se pudo guardar la regla: ' + r1.error.message); return; }
  var ids = gastos.filter(function (g) {
    return g.id === id || (catDe(g) === 'Sin clasificar' && String(g.comercio || '').toUpperCase().indexOf(palabra) !== -1);
  }).map(function (g) { return g.id; });
  var r2 = await db.from('gastos').update({ categoria: categoria }).in('id', ids);
  if (r2.error) { avisar('No se pudo actualizar: ' + r2.error.message); return; }
  avisar(ids.length > 1 ? 'Regla guardada. ' + ids.length + ' gastos clasificados.' : 'Regla guardada.');
  cargar();
}

document.addEventListener('click', async function (e) {
  var btn = e.target.closest('button[data-accion]');
  if (!btn) return;
  e.preventDefault();
  if (DEMO) { avisar('Modo demostración: no se guarda nada.'); return; }
  var cont = btn.closest('[data-id]');
  var id = cont.dataset.id;
  var accion = btn.dataset.accion;

  if (accion === 'clasificar') {
    clasificar(id, cont.querySelector('select').value, cont.querySelector('input').value);
  }
  if (accion === 'deducible') {
    var nuevo = btn.getAttribute('aria-pressed') !== 'true';
    var r = await db.from('gastos').update({ deducible: nuevo }).eq('id', id);
    if (r.error) { avisar('No se pudo guardar.'); return; }
    movs.forEach(function (g) { if (g.id === id) g.deducible = nuevo; });
    avisar(nuevo ? 'Marcado como deducible.' : 'Ya no es deducible.');
    pintar();
  }
  if (accion === 'borrar') {
    var g = movs.filter(function (x) { return x.id === id; })[0];
    if (!confirm('¿Borrar "' + (g.comercio || 'Sin nombre') + '" de ' + eur.format(g.importe) + '? No se puede deshacer.')) return;
    var rb = await db.from('gastos').delete().eq('id', id);
    if (rb.error) { avisar('No se pudo borrar.'); return; }
    avisar('Gasto borrado.');
    cargar();
  }
});

document.addEventListener('change', async function (e) {
  var sel = e.target.closest('select[data-accion="categoria"]');
  if (!sel) return;
  if (DEMO) { avisar('Modo demostración: no se guarda nada.'); return; }
  var id = sel.closest('[data-id]').dataset.id;
  var r = await db.from('gastos').update({ categoria: sel.value }).eq('id', id);
  if (r.error) { avisar('No se pudo cambiar la categoría.'); return; }
  avisar('Categoría cambiada.');
  cargar();
});

$('mes-ant').addEventListener('click', function () { mesActual.setMonth(mesActual.getMonth() - 1); cargar(); });
$('mes-sig').addEventListener('click', function () { mesActual.setMonth(mesActual.getMonth() + 1); cargar(); });
$('recargar').addEventListener('click', cargar);

iniciar();
